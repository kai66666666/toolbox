<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编码解码与摘要工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9e2ec;
      --accent: #1f7a6d;
      --accent-dark: #176157;
      --warn: #a23f22;
      --code: #f8fafc;
      --shadow: 0 18px 50px rgba(18, 38, 63, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(31, 122, 109, 0.12), rgba(49, 95, 150, 0.08)),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .home {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(217, 226, 236, 0.85);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(220px, 1fr);
      gap: 14px;
      align-items: end;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    select,
    textarea,
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: #ffffff;
      outline: none;
    }

    select,
    input {
      min-height: 42px;
      padding: 0 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      padding: 12px;
      background: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    select:focus,
    textarea:focus,
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 109, 0.14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(31, 122, 109, 0.22);
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .secondary {
      color: var(--accent-dark);
      background: rgba(31, 122, 109, 0.1);
    }

    .secondary:hover {
      background: rgba(31, 122, 109, 0.16);
    }

    .status {
      margin-left: auto;
      min-height: 42px;
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--warn);
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
    }

    .block {
      min-width: 0;
      padding: 20px;
    }

    .block + .block {
      border-left: 1px solid var(--line);
    }

    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .length-info {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    .digest-grid {
      display: grid;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .digest-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--code);
    }

    .digest-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .digest-value {
      display: block;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .copy-small {
      min-height: 36px;
      padding: 0 12px;
      color: #243447;
      background: #eef3f8;
      font-size: 13px;
    }

    .copy-small:hover {
      background: #e1eaf3;
    }

    .hint {
      padding: 14px 20px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 20px, 1120px);
        padding: 24px 0;
      }

      .header {
        display: block;
      }

      h1 {
        font-size: 32px;
      }

      .home {
        display: inline-block;
        margin-top: 12px;
      }

      .controls,
      .workspace {
        grid-template-columns: 1fr;
      }

      .block + .block {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .status {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div>
        <h1>编码解码与摘要工具</h1>
        <p class="subtitle">处理常见 Base64、URL、HTML 实体、Hex 编码，并生成 SHA-256 摘要。</p>
      </div>
      <a class="home" href="./index.html">返回首页</a>
    </div>

    <section class="panel" aria-label="编码解码与摘要">
      <div class="controls">
        <label>
          操作类型
          <select id="operationInput">
            <option value="base64-encode">Base64 编码</option>
            <option value="base64-decode">Base64 解码</option>
            <option value="base64url-encode">Base64URL 编码</option>
            <option value="base64url-decode">Base64URL 解码</option>
            <option value="url-encode">URL 编码</option>
            <option value="url-decode">URL 解码</option>
            <option value="html-encode">HTML 实体编码</option>
            <option value="html-decode">HTML 实体解码</option>
            <option value="hex-encode">Hex 编码</option>
            <option value="hex-decode">Hex 解码</option>
            <option value="sha256">SHA-256 摘要</option>
          </select>
        </label>

        <label>
          输出大小写
          <select id="caseInput">
            <option value="lower" selected>小写</option>
            <option value="upper">大写</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="runBtn" type="button">执行转换</button>
        <button class="secondary" id="swapBtn" type="button">交换输入输出</button>
        <button class="secondary" id="copyBtn" type="button">复制输出</button>
        <button class="secondary" id="clearBtn" type="button">清空</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>

      <div class="workspace">
        <div class="block">
          <div class="block-head">
            <h2>输入</h2>
            <span class="length-info" id="inputLength">0 字符 / 0 字节</span>
          </div>
          <textarea id="inputText" spellcheck="false" placeholder="在这里输入要处理的文本"></textarea>
        </div>

        <div class="block">
          <div class="block-head">
            <h2>输出</h2>
            <span class="length-info" id="outputLength">0 字符 / 0 字节</span>
          </div>
          <textarea id="outputText" readonly spellcheck="false"></textarea>
        </div>
      </div>

      <div class="digest-grid" aria-label="常用摘要">
        <div class="digest-item">
          <div>
            <span class="digest-label">SHA-256 Hex</span>
            <span class="digest-value" id="sha256Hex"></span>
          </div>
          <button class="copy-small" id="copyShaHexBtn" type="button">复制</button>
        </div>

        <div class="digest-item">
          <div>
            <span class="digest-label">SHA-256 Base64</span>
            <span class="digest-value" id="sha256Base64"></span>
          </div>
          <button class="copy-small" id="copyShaBase64Btn" type="button">复制</button>
        </div>
      </div>

      <div class="hint">所有处理都在浏览器本地完成。SHA-256 会随输入实时刷新；执行转换按钮用于左侧选择的编码/解码操作。</div>
    </section>
  </main>

  <script>
    const operationInput = document.getElementById("operationInput");
    const caseInput = document.getElementById("caseInput");
    const inputText = document.getElementById("inputText");
    const outputText = document.getElementById("outputText");
    const inputLength = document.getElementById("inputLength");
    const outputLength = document.getElementById("outputLength");
    const sha256Hex = document.getElementById("sha256Hex");
    const sha256Base64 = document.getElementById("sha256Base64");
    const runBtn = document.getElementById("runBtn");
    const swapBtn = document.getElementById("swapBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const copyShaHexBtn = document.getElementById("copyShaHexBtn");
    const copyShaBase64Btn = document.getElementById("copyShaBase64Btn");
    const statusEl = document.getElementById("status");

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function textBytes(text) {
      return new TextEncoder().encode(text);
    }

    function bytesToText(bytes) {
      return new TextDecoder().decode(bytes);
    }

    function bytesToBase64(bytes) {
      let binary = "";
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value.replace(/\s+/g, ""));
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }

      return bytes;
    }

    function toBase64Url(base64) {
      return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function fromBase64Url(value) {
      const normalized = value.trim().replace(/-/g, "+").replace(/_/g, "/");
      return normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
    }

    function bytesToHex(bytes) {
      return [...bytes].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function hexToBytes(value) {
      const cleaned = value.replace(/\s+/g, "");

      if (!/^[0-9a-f]*$/i.test(cleaned) || cleaned.length % 2 !== 0) {
        throw new Error("invalid hex");
      }

      const bytes = new Uint8Array(cleaned.length / 2);
      for (let index = 0; index < cleaned.length; index += 2) {
        bytes[index / 2] = Number.parseInt(cleaned.slice(index, index + 2), 16);
      }

      return bytes;
    }

    function htmlEncode(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function htmlDecode(text) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = text;
      return textarea.value;
    }

    function applyCase(value) {
      return caseInput.value === "upper" ? value.toUpperCase() : value.toLowerCase();
    }

    function updateLength(target, text) {
      const chars = Array.from(text).length;
      const bytes = textBytes(text).length;
      target.textContent = `${chars} 字符 / ${bytes} 字节`;
    }

    async function updateDigest() {
      const bytes = textBytes(inputText.value);
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
      sha256Hex.textContent = applyCase(bytesToHex(digest));
      sha256Base64.textContent = bytesToBase64(digest);
    }

    async function runOperation() {
      try {
        const value = inputText.value;
        let result = "";

        switch (operationInput.value) {
          case "base64-encode":
            result = bytesToBase64(textBytes(value));
            break;
          case "base64-decode":
            result = bytesToText(base64ToBytes(value));
            break;
          case "base64url-encode":
            result = toBase64Url(bytesToBase64(textBytes(value)));
            break;
          case "base64url-decode":
            result = bytesToText(base64ToBytes(fromBase64Url(value)));
            break;
          case "url-encode":
            result = encodeURIComponent(value);
            break;
          case "url-decode":
            result = decodeURIComponent(value.replace(/\+/g, " "));
            break;
          case "html-encode":
            result = htmlEncode(value);
            break;
          case "html-decode":
            result = htmlDecode(value);
            break;
          case "hex-encode":
            result = applyCase(bytesToHex(textBytes(value)));
            break;
          case "hex-decode":
            result = bytesToText(hexToBytes(value));
            break;
          case "sha256":
            result = sha256Hex.textContent;
            break;
          default:
            result = value;
        }

        outputText.value = result;
        updateLength(outputLength, outputText.value);
        setStatus("已完成。");
      } catch (error) {
        setStatus("转换失败，请检查输入格式。", true);
      }
    }

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        setStatus(message);
      } catch (error) {
        setStatus("复制失败，请手动选中复制。", true);
      }
    }

    function refresh() {
      updateLength(inputLength, inputText.value);
      updateLength(outputLength, outputText.value);
      updateDigest().catch(() => setStatus("当前环境不支持 SHA-256 摘要。", true));
    }

    inputText.addEventListener("input", refresh);
    caseInput.addEventListener("change", () => {
      refresh();
      if (operationInput.value === "hex-encode" || operationInput.value === "sha256") {
        runOperation();
      }
    });
    runBtn.addEventListener("click", runOperation);
    swapBtn.addEventListener("click", () => {
      const oldInput = inputText.value;
      inputText.value = outputText.value;
      outputText.value = oldInput;
      refresh();
      setStatus("已交换输入输出。");
    });
    copyBtn.addEventListener("click", () => copyText(outputText.value, "已复制输出。"));
    copyShaHexBtn.addEventListener("click", () => copyText(sha256Hex.textContent, "已复制 SHA-256 Hex。"));
    copyShaBase64Btn.addEventListener("click", () => copyText(sha256Base64.textContent, "已复制 SHA-256 Base64。"));
    clearBtn.addEventListener("click", () => {
      inputText.value = "";
      outputText.value = "";
      refresh();
      setStatus("已清空。");
    });

    inputText.value = "hello toolbox";
    refresh();
    runOperation();
  </script>
</body>
</html>
