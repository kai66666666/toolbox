<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>强类型密码生成器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #697586;
      --line: #d9e2ec;
      --accent: #1f7a6d;
      --accent-dark: #176157;
      --warn: #a23f22;
      --shadow: 0 18px 50px rgba(18, 38, 63, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(135deg, rgba(31, 122, 109, 0.12), rgba(30, 89, 154, 0.08)),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(217, 226, 236, 0.85);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(4, minmax(110px, auto));
      gap: 14px;
      align-items: end;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    label {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      font-size: 16px;
      color: var(--text);
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 109, 0.14);
    }

    .check {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(31, 122, 109, 0.22);
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .secondary {
      color: var(--accent-dark);
      background: rgba(31, 122, 109, 0.1);
    }

    .secondary:hover {
      background: rgba(31, 122, 109, 0.16);
    }

    .status {
      margin-left: auto;
      min-height: 42px;
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .password-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .password-item {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }

    .password-item:last-child {
      border-bottom: 0;
    }

    .index {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .password {
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.4;
    }

    .copy-one {
      min-width: 72px;
      background: #eef3f8;
      color: #243447;
    }

    .copy-one:hover {
      background: #e1eaf3;
    }

    .hint {
      padding: 14px 20px 18px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    .error {
      color: var(--warn);
      font-weight: 700;
    }

    @media (max-width: 820px) {
      .header {
        display: block;
      }

      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .status {
        width: 100%;
        margin-left: 0;
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 20px, 980px);
        padding: 24px 0;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .password-item {
        grid-template-columns: 28px minmax(0, 1fr);
      }

      .copy-one {
        grid-column: 2;
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div>
        <h1>强类型密码生成器</h1>
        <p class="subtitle">点击生成，一次得到 10 个包含多种字符类型的强密码。</p>
      </div>
    </div>

    <section class="panel" aria-label="密码生成工具">
      <div class="controls">
        <label>
          密码长度
          <input id="lengthInput" type="number" min="8" max="64" value="16">
        </label>

        <label class="check">
          <input id="upperInput" type="checkbox" checked>
          大写字母
        </label>

        <label class="check">
          <input id="lowerInput" type="checkbox" checked>
          小写字母
        </label>

        <label class="check">
          <input id="numberInput" type="checkbox" checked>
          数字
        </label>

        <label class="check">
          <input id="symbolInput" type="checkbox" checked>
          特殊符号
        </label>
      </div>

      <div class="actions">
        <button class="primary" id="generateBtn" type="button">生成 10 个强密码</button>
        <button class="secondary" id="copyAllBtn" type="button">复制全部</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>

      <ol class="password-list" id="passwordList"></ol>
      <div class="hint">默认使用浏览器内置的安全随机数生成器。建议长度不少于 12 位，并保留至少三种字符类型。</div>
    </section>
  </main>

  <script>
    const groups = {
      upper: "ABCDEFGHJKLMNPQRSTUVWXYZ",
      lower: "abcdefghijkmnopqrstuvwxyz",
      number: "23456789",
      symbol: "!@#$%^&*()-_=+[]{};:,.?/|~"
    };

    const lengthInput = document.getElementById("lengthInput");
    const upperInput = document.getElementById("upperInput");
    const lowerInput = document.getElementById("lowerInput");
    const numberInput = document.getElementById("numberInput");
    const symbolInput = document.getElementById("symbolInput");
    const generateBtn = document.getElementById("generateBtn");
    const copyAllBtn = document.getElementById("copyAllBtn");
    const passwordList = document.getElementById("passwordList");
    const statusEl = document.getElementById("status");

    let passwords = [];

    function secureIndex(max) {
      const values = new Uint32Array(1);
      const limit = Math.floor(0xffffffff / max) * max;
      let value;

      do {
        crypto.getRandomValues(values);
        value = values[0];
      } while (value >= limit);

      return value % max;
    }

    function pick(chars) {
      return chars[secureIndex(chars.length)];
    }

    function shuffle(chars) {
      const result = [...chars];

      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = secureIndex(i + 1);
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result.join("");
    }

    function selectedGroups() {
      return [
        upperInput.checked ? groups.upper : "",
        lowerInput.checked ? groups.lower : "",
        numberInput.checked ? groups.number : "",
        symbolInput.checked ? groups.symbol : ""
      ].filter(Boolean);
    }

    function generatePassword(length, selected) {
      const allChars = selected.join("");
      const required = selected.map(pick);
      const remainingCount = length - required.length;
      const remaining = Array.from({ length: remainingCount }, () => pick(allChars));

      return shuffle(required.concat(remaining));
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function renderPasswords() {
      passwordList.innerHTML = "";

      passwords.forEach((password, index) => {
        const item = document.createElement("li");
        item.className = "password-item";

        const number = document.createElement("span");
        number.className = "index";
        number.textContent = String(index + 1).padStart(2, "0");

        const text = document.createElement("span");
        text.className = "password";
        text.textContent = password;

        const button = document.createElement("button");
        button.className = "copy-one";
        button.type = "button";
        button.textContent = "复制";
        button.addEventListener("click", () => copyText(password, "已复制第 " + (index + 1) + " 个密码"));

        item.append(number, text, button);
        passwordList.append(item);
      });
    }

    function generatePasswords() {
      const length = Number.parseInt(lengthInput.value, 10);
      const selected = selectedGroups();

      if (!Number.isInteger(length) || length < 8 || length > 64) {
        setStatus("密码长度需要在 8 到 64 位之间。", true);
        return;
      }

      if (selected.length < 1) {
        setStatus("请至少选择一种字符类型。", true);
        return;
      }

      if (length < selected.length) {
        setStatus("长度不能小于已选择的字符类型数量。", true);
        return;
      }

      passwords = Array.from({ length: 10 }, () => generatePassword(length, selected));
      renderPasswords();
      setStatus("已生成 10 个强密码。");
    }

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
        setStatus(successMessage);
      } catch (error) {
        setStatus("复制失败，请手动选中复制。", true);
      }
    }

    copyAllBtn.addEventListener("click", () => {
      if (passwords.length === 0) {
        setStatus("请先生成密码。", true);
        return;
      }

      copyText(passwords.join("\n"), "已复制全部密码。");
    });

    generateBtn.addEventListener("click", generatePasswords);
    generatePasswords();
  </script>
</body>
</html>
