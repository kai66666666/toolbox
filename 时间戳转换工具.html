<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间戳转换工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9e2ec;
      --accent: #1f7a6d;
      --accent-dark: #176157;
      --blue: #315f96;
      --warn: #a23f22;
      --shadow: 0 18px 50px rgba(18, 38, 63, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(31, 122, 109, 0.12), rgba(49, 95, 150, 0.08)),
        var(--bg);
      color: var(--text);
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .home {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(217, 226, 236, 0.85);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .primary {
      color: #ffffff;
      background: var(--accent);
      box-shadow: 0 8px 18px rgba(31, 122, 109, 0.22);
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .secondary {
      color: var(--accent-dark);
      background: rgba(31, 122, 109, 0.1);
    }

    .secondary:hover {
      background: rgba(31, 122, 109, 0.16);
    }

    .status {
      margin-left: auto;
      min-height: 42px;
      display: flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      color: var(--warn);
      font-weight: 700;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
    }

    .section {
      min-width: 0;
      padding: 20px;
    }

    .section + .section {
      border-left: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      letter-spacing: 0;
    }

    label {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--text);
      background: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 109, 0.14);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    .result-list {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .result-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
    }

    .result-label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .result-value {
      display: block;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.45;
    }

    .copy {
      min-width: 64px;
      color: #243447;
      background: #eef3f8;
    }

    .copy:hover {
      background: #e1eaf3;
    }

    .hint {
      padding: 14px 20px 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    @media (max-width: 780px) {
      main {
        width: min(100% - 20px, 980px);
        padding: 24px 0;
      }

      .header {
        display: block;
      }

      h1 {
        font-size: 32px;
      }

      .home {
        display: inline-block;
        margin-top: 12px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .section + .section {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .status {
        width: 100%;
        margin-left: 0;
      }
    }

    @media (max-width: 480px) {
      .quick-grid,
      .result-item {
        grid-template-columns: 1fr;
      }

      .copy {
        width: max-content;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <div>
        <h1>时间戳转换工具</h1>
        <p class="subtitle">在 Unix 时间戳、日期时间和 ISO 字符串之间快速转换。</p>
      </div>
      <a class="home" href="./index.html">返回首页</a>
    </div>

    <section class="panel" aria-label="时间戳转换">
      <div class="toolbar">
        <button class="primary" id="nowBtn" type="button">使用当前时间</button>
        <button class="secondary" id="clearBtn" type="button">清空输入</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>

      <div class="workspace">
        <div class="section">
          <h2>时间戳转日期</h2>
          <label>
            Unix 时间戳
            <input id="timestampInput" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="例如 1787808000 或 1787808000000">
          </label>
          <label>
            单位
            <select id="timestampUnit">
              <option value="auto">自动判断</option>
              <option value="second">秒</option>
              <option value="millisecond">毫秒</option>
            </select>
          </label>
          <div class="quick-grid">
            <button class="secondary" id="secondsNowBtn" type="button">填入当前秒</button>
            <button class="secondary" id="millisNowBtn" type="button">填入当前毫秒</button>
          </div>
        </div>

        <div class="section">
          <h2>日期转时间戳</h2>
          <label>
            日期时间
            <input id="datetimeInput" type="datetime-local" step="1">
          </label>
          <label>
            文本时间
            <input id="textTimeInput" type="text" autocomplete="off" spellcheck="false" placeholder="例如 2026-08-27 09:30:00">
          </label>
          <div class="quick-grid">
            <button class="secondary" id="syncTextBtn" type="button">从文本转换</button>
            <button class="secondary" id="syncDatetimeBtn" type="button">从日期控件转换</button>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>转换结果</h2>
        <div class="result-list" id="resultList"></div>
      </div>

      <div class="hint">自动判断会把 12 位及以上数字视为毫秒，其余视为秒。日期控件按当前浏览器时区解析，文本时间支持常见的 yyyy-MM-dd HH:mm:ss 和 ISO 格式。</div>
    </section>
  </main>

  <script>
    const timestampInput = document.getElementById("timestampInput");
    const timestampUnit = document.getElementById("timestampUnit");
    const datetimeInput = document.getElementById("datetimeInput");
    const textTimeInput = document.getElementById("textTimeInput");
    const resultList = document.getElementById("resultList");
    const statusEl = document.getElementById("status");

    const fields = [
      ["seconds", "秒级时间戳"],
      ["milliseconds", "毫秒级时间戳"],
      ["local", "本地时间"],
      ["beijing", "北京时间"],
      ["iso", "ISO 8601"],
      ["utc", "UTC 时间"]
    ];

    let activeDate = new Date();

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatWithOffset(date, offsetMinutes) {
      const shifted = new Date(date.getTime() + offsetMinutes * 60 * 1000);
      const year = shifted.getUTCFullYear();
      const month = pad(shifted.getUTCMonth() + 1);
      const day = pad(shifted.getUTCDate());
      const hour = pad(shifted.getUTCHours());
      const minute = pad(shifted.getUTCMinutes());
      const second = pad(shifted.getUTCSeconds());

      return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
    }

    function formatLocal(date) {
      const year = date.getFullYear();
      const month = pad(date.getMonth() + 1);
      const day = pad(date.getDate());
      const hour = pad(date.getHours());
      const minute = pad(date.getMinutes());
      const second = pad(date.getSeconds());

      return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
    }

    function toDatetimeLocalValue(date) {
      return formatLocal(date).replace(" ", "T");
    }

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? "status error" : "status";
    }

    function parseTimestamp(value, unit) {
      const cleaned = value.trim();

      if (!/^-?\d+(?:\.\d+)?$/.test(cleaned)) {
        return null;
      }

      const number = Number(cleaned);
      if (!Number.isFinite(number)) {
        return null;
      }

      if (unit === "second") {
        return new Date(number * 1000);
      }

      if (unit === "millisecond") {
        return new Date(number);
      }

      return new Date(Math.abs(number) >= 100000000000 ? number : number * 1000);
    }

    function parseTextTime(value) {
      const trimmed = value.trim();
      if (!trimmed) {
        return null;
      }

      const localMatch = trimmed
        .replace(/\//g, "-")
        .match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:\s+|T)(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);

      if (localMatch) {
        const [year, month, day, hour, minute, second] = localMatch
          .slice(1)
          .map((part) => Number(part || 0));
        const date = new Date(year, month - 1, day, hour, minute, second);

        if (
          date.getFullYear() !== year
          || date.getMonth() !== month - 1
          || date.getDate() !== day
          || date.getHours() !== hour
          || date.getMinutes() !== minute
          || date.getSeconds() !== second
        ) {
          return null;
        }

        return date;
      }

      const date = new Date(trimmed);

      return Number.isNaN(date.getTime()) ? null : date;
    }

    function resultValues(date) {
      return {
        seconds: Math.floor(date.getTime() / 1000).toString(),
        milliseconds: date.getTime().toString(),
        local: formatLocal(date),
        beijing: `${formatWithOffset(date, 480)} GMT+08:00`,
        iso: date.toISOString(),
        utc: `${formatWithOffset(date, 0)} UTC`
      };
    }

    function renderResults(date) {
      const values = resultValues(date);
      resultList.innerHTML = "";

      fields.forEach(([key, label]) => {
        const item = document.createElement("div");
        item.className = "result-item";

        const content = document.createElement("div");
        const title = document.createElement("span");
        title.className = "result-label";
        title.textContent = label;

        const value = document.createElement("span");
        value.className = "result-value";
        value.textContent = values[key];

        const button = document.createElement("button");
        button.className = "copy";
        button.type = "button";
        button.textContent = "复制";
        button.addEventListener("click", () => copyText(values[key], `已复制${label}。`));

        content.append(title, value);
        item.append(content, button);
        resultList.append(item);
      });
    }

    function setActiveDate(date, message) {
      if (Number.isNaN(date.getTime())) {
        setStatus("无法识别这个时间，请检查输入格式。", true);
        return;
      }

      activeDate = date;
      timestampInput.value = date.getTime().toString();
      datetimeInput.value = toDatetimeLocalValue(date);
      textTimeInput.value = formatLocal(date);
      renderResults(date);
      setStatus(message);
    }

    function convertFromTimestamp() {
      const date = parseTimestamp(timestampInput.value, timestampUnit.value);

      if (!date) {
        setStatus("请输入有效的秒级或毫秒级时间戳。", true);
        return;
      }

      setActiveDate(date, "已根据时间戳完成转换。");
    }

    function convertFromDatetime() {
      if (!datetimeInput.value) {
        setStatus("请选择日期时间。", true);
        return;
      }

      setActiveDate(new Date(datetimeInput.value), "已根据日期控件完成转换。");
    }

    function convertFromText() {
      const date = parseTextTime(textTimeInput.value);

      if (!date) {
        setStatus("文本时间格式无法识别。", true);
        return;
      }

      setActiveDate(date, "已根据文本时间完成转换。");
    }

    async function copyText(text, successMessage) {
      try {
        await navigator.clipboard.writeText(text);
        setStatus(successMessage);
      } catch (error) {
        setStatus("复制失败，请手动选中复制。", true);
      }
    }

    document.getElementById("nowBtn").addEventListener("click", () => {
      setActiveDate(new Date(), "已更新为当前时间。");
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      timestampInput.value = "";
      datetimeInput.value = "";
      textTimeInput.value = "";
      renderResults(activeDate);
      setStatus("已清空输入，结果保留上一次转换。");
    });

    document.getElementById("secondsNowBtn").addEventListener("click", () => {
      timestampUnit.value = "second";
      timestampInput.value = Math.floor(Date.now() / 1000).toString();
      convertFromTimestamp();
    });

    document.getElementById("millisNowBtn").addEventListener("click", () => {
      timestampUnit.value = "millisecond";
      timestampInput.value = Date.now().toString();
      convertFromTimestamp();
    });

    document.getElementById("syncTextBtn").addEventListener("click", convertFromText);
    document.getElementById("syncDatetimeBtn").addEventListener("click", convertFromDatetime);
    timestampInput.addEventListener("input", convertFromTimestamp);
    timestampUnit.addEventListener("change", convertFromTimestamp);
    datetimeInput.addEventListener("change", convertFromDatetime);
    textTimeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        convertFromText();
      }
    });

    setActiveDate(new Date(), "已载入当前时间。");
  </script>
</body>
</html>
