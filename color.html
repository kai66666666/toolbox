<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>颜色预览</title>
  <style>
    :root {
      color-scheme: light;
      --preview-color: #E0E0E0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f6f8;
      color: #1f2933;
    }

    main {
      width: min(92vw, 560px);
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d9dee7;
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.12);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #52606d;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      min-height: 46px;
      border: 1px solid #bcc7d3;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0;
      outline: none;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.18);
    }

    input[type="color"] {
      width: 54px;
      height: 46px;
      padding: 3px;
      border: 1px solid #bcc7d3;
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .preview {
      margin-top: 22px;
      height: 230px;
      border: 1px solid #b7c0cc;
      border-radius: 8px;
      background:
        linear-gradient(45deg, rgba(0, 0, 0, 0.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(0, 0, 0, 0.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(0, 0, 0, 0.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(0, 0, 0, 0.08) 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
      overflow: hidden;
    }

    .swatch {
      width: 100%;
      height: 100%;
      background: var(--preview-color);
      transition: background-color 120ms ease;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 16px;
      font-size: 15px;
    }

    .formats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .format-item {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      background: #f8fafc;
    }

    .format-label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #52606d;
    }

    .value {
      display: block;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
    }

    .status {
      min-height: 22px;
      color: #52606d;
    }

    .status.error {
      color: #c92a2a;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      main {
        padding: 20px;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      input[type="color"] {
        width: 100%;
      }

      .formats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>颜色预览</h1>
    <label for="colorText">输入 HEX、0x 或 RGB 颜色</label>
    <div class="input-row">
      <input id="colorText" type="text" value="E0E0E0" maxlength="24" autocomplete="off" spellcheck="false" aria-describedby="status">
      <input id="colorPicker" type="color" value="#E0E0E0" aria-label="选择颜色">
    </div>

    <div class="preview" aria-label="颜色效果预览">
      <div class="swatch" id="swatch"></div>
    </div>

    <div class="meta">
      <div class="formats">
        <span class="format-item">
          <span class="format-label">HEX</span>
          <span class="value" id="hexValue">#E0E0E0</span>
        </span>
        <span class="format-item">
          <span class="format-label">RGB</span>
          <span class="value" id="rgbValue">rgb(224, 224, 224)</span>
        </span>
      </div>
      <span class="status" id="status">格式正确</span>
    </div>
  </main>

  <script>
    const colorText = document.getElementById("colorText");
    const colorPicker = document.getElementById("colorPicker");
    const hexValue = document.getElementById("hexValue");
    const rgbValue = document.getElementById("rgbValue");
    const status = document.getElementById("status");

    function normalizeColor(input) {
      const trimmed = input.trim();
      const hexMatch = trimmed.match(/^(?:#|0x)?([0-9a-f]{6})$/i);

      if (hexMatch) {
        return hexToColor(`#${hexMatch[1].toUpperCase()}`);
      }

      const rgbMatch = trimmed.match(/^rgb\s*\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i)
        || trimmed.match(/^(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})$/);

      if (!rgbMatch) {
        return null;
      }

      const rgb = rgbMatch.slice(1, 4).map(Number);
      return rgb.every((value) => value >= 0 && value <= 255) ? rgbToColor(rgb) : null;
    }

    function hexToColor(hex) {
      return {
        hex,
        rgb: [
          parseInt(hex.slice(1, 3), 16),
          parseInt(hex.slice(3, 5), 16),
          parseInt(hex.slice(5, 7), 16),
        ],
      };
    }

    function rgbToColor(rgb) {
      const hex = rgb
        .map((value) => value.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();

      return {
        hex: `#${hex}`,
        rgb,
      };
    }

    function setColor(color, syncText) {
      document.documentElement.style.setProperty("--preview-color", color.hex);
      colorPicker.value = color.hex;
      hexValue.textContent = color.hex;
      rgbValue.textContent = `rgb(${color.rgb.join(", ")})`;
      status.textContent = "格式正确";
      status.classList.remove("error");
      if (syncText) {
        colorText.value = color.hex.slice(1);
      }
    }

    colorText.addEventListener("input", () => {
      const normalized = normalizeColor(colorText.value);

      if (normalized) {
        setColor(normalized, false);
        return;
      }

      status.textContent = "请输入类似 E0E0E0、0xE0E0E0、222,222,222 的格式";
      status.classList.add("error");
    });

    colorPicker.addEventListener("input", () => {
      setColor(hexToColor(colorPicker.value.toUpperCase()), true);
    });
  </script>
</body>
</html>
